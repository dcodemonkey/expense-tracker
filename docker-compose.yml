services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-tracker-db
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: expense-tracker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-tracker-api
    environment:
      DATABASE_URL: postgresql+asyncpg://neondb_owner:npg_6xuvKEZpQTU0@ep-summer-dream-azp1gfwh.c-3.ap-southeast-1.aws.neon.tech/neondb?ssl=require
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: expense-tracker-dev-secret-key-change-in-production-32x
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 11520
      FRONTEND_URL: http://localhost:3000
      ADMIN_URL: http://localhost:8501
      API_V1_STR: /api/v1
      ADMIN_EMAILS: test@test.com,in.developer@outlook.com
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense-tracker-web
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: expense-tracker-admin
    environment:
      API_BASE_URL: http://backend:8000/api/v1
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./admin:/app

volumes:
  postgres_data:
  redis_data: